name: civil_dpr
description: Civil DPR & Attendance Management System for civil construction companies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_analytics: ^11.4.4
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.5

  # State Management
  provider: ^6.1.1
  get_it: ^7.6.4

  # Navigation
  go_router: ^13.0.0

  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  table_calendar: ^3.1.2

  # Camera & Image
  camera: ^0.10.5+5
  image_picker: ^1.0.7
  google_mlkit_face_detection: ^0.13.1
  image: ^4.2.0
  image_cropper: ^9.0.0
  permission_handler: ^11.2.0

  # Location & Maps
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.3

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0
  open_file: ^3.3.2
  path_provider: ^2.1.2

  # Local Storage (Offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.1.2
  url_launcher: ^6.2.4
  share_plus: ^10.1.4
  file_picker: ^8.0.0
  dio: ^5.4.0
  rxdart: ^0.27.7
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
